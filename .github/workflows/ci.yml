name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install verification dependencies
        run: python -m pip install --upgrade pytest PyYAML mypy types-PyYAML
      - name: Strict typing
        run: mypy --strict scripts/validate_prework.py
      - name: Tests
        run: pytest -q
